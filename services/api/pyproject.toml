[project]
name = "candor-api"
version = "0.1.0"
description = "Candor zero-knowledge report API"
requires-python = ">=3.12"
dependencies = [
  "candor-pipeline",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "sqlalchemy>=2.0",
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "pynacl>=1.5",
  "cryptography>=43",
  "pyjwt>=2.9",
  "httpx>=0.27",
  "sse-starlette>=2.1",
  "typer>=0.12",
  "orjson>=3.10",
  "eth-account>=0.13",
  "psycopg[binary]>=3.2",
  "modal>=1.6.2",
]

[project.scripts]
candor-api = "candor_api.cli:app"

[tool.uv.sources]
candor-pipeline = { path = "../pipeline", editable = true }

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candor_api"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
