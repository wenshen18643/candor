[project]
name = "candor-pipeline"
version = "0.1.0"
description = "Candor multi-stage evidence analysis pipeline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.9",
  "httpx>=0.27",
  "openai>=1.50",
  "pynacl>=1.5",
  "rapidfuzz>=3.9",
  "python-dateutil>=2.9",
  "dateparser>=1.2",
  "numpy>=2.0",
  "typer>=0.12",
  "orjson>=3.10",
]

[project.scripts]
candor-pipeline = "candor_pipeline.cli:app"
candor-worker = "candor_pipeline.worker:main"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/candor_pipeline"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "-p no:cacheprovider"

[tool.ruff]
extend = "../../ruff.toml"
extend-exclude = [".venv", "data", ".tmp", "pytest-cache-files-*"]
